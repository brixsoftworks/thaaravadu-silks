name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev || npm install --omit=dev
      - run: node --check api/create-checkout-session.js
      - run: node --check api/stripe-webhook.js
      - name: Block committed secrets
        run: |
          pipx install gitleaks 2>/dev/null || true
          gitleaks detect --no-banner --redact || \
            { echo '::error::Secrets detected in history/working tree'; exit 1; }
